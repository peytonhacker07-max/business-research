name: Assignment reminders

on:
  # 9 AM and 9 PM Eastern daily. Four UTC times are scheduled — 13:00/01:00
  # hit those hours during daylight saving, 14:00/02:00 once it ends — and the
  # script sends only on the runs that are actually 9 AM or 9 PM locally, so
  # both times hold year-round. GitHub's scheduler drifts under load, so expect
  # "sometime in the 9 o'clock hour" rather than exactly 9:00.
  schedule:
    - cron: "0 1,2,13,14 * * *"
  # A manual run always sends, so it doubles as the delivery test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: habit-tracker/package-lock.json

      - name: Install dependencies
        working-directory: habit-tracker
        run: npm ci

      - name: Send reminder for what's due
        working-directory: habit-tracker
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/send-reminders.mjs
