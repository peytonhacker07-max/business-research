name: Assignment reminders

on:
  # Targets 9 AM and 9 PM Eastern (an hour earlier once daylight saving ends
  # in November). 12:40 UTC is 8:40 AM Eastern, 00:40 UTC is 8:40 PM.
  #
  # Two deliberate choices, both about GitHub's scheduler rather than the
  # clock. Every run scheduled at minute :00 arrived 2h45m-4h35m late, which
  # is where the whole world puts its crons, so these sit at :40 instead. And
  # they aim twenty minutes early, so a modest queue lands them near 9 rather
  # than past it.
  #
  # There is deliberately no "is it really 9 o'clock?" check: an earlier
  # version had one, a run arrived four hours late, and the notification was
  # silently dropped. Every scheduled run sends, however late it lands.
  schedule:
    - cron: "40 0,12 * * *"
  # A manual run always sends, so it doubles as the delivery test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: habit-tracker/package-lock.json

      - name: Install dependencies
        working-directory: habit-tracker
        run: npm ci

      - name: Send reminder for what's due
        working-directory: habit-tracker
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/send-reminders.mjs
