name: Assignment reminders

on:
  # 13:00 UTC is 9 AM Eastern and 01:00 UTC is 9 PM Eastern, while daylight
  # saving is in effect; both land an hour earlier once it ends in November.
  #
  # An earlier version scheduled four times and had the script send only on
  # the run that was exactly 9 AM or 9 PM locally, so the times would hold
  # year-round. GitHub delivered a run four hours behind schedule and that
  # check silently dropped it, so there is deliberately no such check now:
  # every scheduled run sends, however late it arrives. A reminder at the
  # wrong hour beats no reminder.
  schedule:
    - cron: "0 1,13 * * *"
  # A manual run always sends, so it doubles as the delivery test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: habit-tracker/package-lock.json

      - name: Install dependencies
        working-directory: habit-tracker
        run: npm ci

      - name: Send reminder for what's due
        working-directory: habit-tracker
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/send-reminders.mjs
