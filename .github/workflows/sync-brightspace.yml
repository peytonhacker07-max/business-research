name: Sync Brightspace assignments

on:
  schedule:
    - cron: "0 12 * * 0" # every Sunday at 12:00 UTC
  # TEMPORARY: one-off run to publish the first encrypted sync. Removed next.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-brightspace.yml"
  workflow_dispatch:
    inputs:
      debug_event:
        description: "Log the full calendar entry for events whose title contains this"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and parse Brightspace calendar
        working-directory: habit-tracker
        env:
          BRIGHTSPACE_ICS_URL: ${{ secrets.BRIGHTSPACE_ICS_URL }}
          ASSIGNMENTS_PASSPHRASE: ${{ secrets.ASSIGNMENTS_PASSPHRASE }}
          DEBUG_EVENT: ${{ inputs.debug_event }}
        run: node scripts/sync-brightspace.mjs

      - name: Build the weekly study plan
        working-directory: habit-tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSIGNMENTS_PASSPHRASE: ${{ secrets.ASSIGNMENTS_PASSPHRASE }}
        run: node scripts/plan-week.mjs

      - name: Commit updated assignments
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # study-plan.json only exists when an Anthropic key is configured.
          # Naming a missing path makes git add fail the whole job, which is
          # what silently broke this sync for a week.
          git add habit-tracker/public/assignments.json
          if [ -f habit-tracker/public/study-plan.json ]; then
            git add habit-tracker/public/study-plan.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync Brightspace assignments"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        # A push made with the default GITHUB_TOKEN doesn't fire other
        # workflows' `on: push` triggers (this prevents infinite loops), so
        # the deploy has to be kicked off explicitly here instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
