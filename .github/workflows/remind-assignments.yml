name: Assignment reminders

on:
  # 9 AM Eastern daily. Both UTC times are scheduled — 13:00 is 9 AM during
  # daylight saving, 14:00 is 9 AM once it ends — and the script sends only
  # on whichever run is actually 9 AM locally, so the time holds year-round.
  # GitHub's scheduler drifts under load, so expect "sometime in the 9 o'clock
  # hour" rather than exactly 9:00.
  schedule:
    - cron: "0 13,14 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification even if nothing is due"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: habit-tracker/package-lock.json

      - name: Install dependencies
        working-directory: habit-tracker
        run: npm ci

      - name: Send reminder for what's due
        working-directory: habit-tracker
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FORCE_TEST: ${{ inputs.test }}
        run: node scripts/send-reminders.mjs
