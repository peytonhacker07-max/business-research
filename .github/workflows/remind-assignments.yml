name: Assignment reminders

on:
  # Fires every two hours rather than twice a day, because GitHub's shared
  # scheduler has delivered every single run of this workflow 2h45m-4h35m
  # behind schedule, and has dropped some entirely. Moving off minute :00
  # made no difference, so the schedule no longer tries to be the clock.
  #
  # Instead the script sends only when a run happens to land inside the
  # morning or evening window, and records what it has already sent that day
  # so the other runs stay quiet. Firing often means that however far any
  # individual run slips, something arrives inside each window.
  schedule:
    - cron: "40 */2 * * *"
  # A manual run always sends, ignoring both window and record, so it stays
  # usable as a delivery test.
  workflow_dispatch:

# Needed to record what has already been sent today.
permissions:
  contents: write

# One at a time — two runs sending before either records it would double up.
concurrency:
  group: assignment-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: habit-tracker/package-lock.json

      - name: Install dependencies
        working-directory: habit-tracker
        run: npm ci

      - name: Send reminder for what's due
        working-directory: habit-tracker
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/send-reminders.mjs

      - name: Record what was sent
        run: |
          if git diff --quiet -- .github/reminder-state.json; then
            echo "Nothing sent this run — no record to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/reminder-state.json
          git commit -m "Record reminder sent"
          # Another run may have pushed while this one was sending.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          echo "Could not push the record after 3 attempts." >&2
          exit 1
