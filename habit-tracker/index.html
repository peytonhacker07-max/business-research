<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Daily — Habit Tracker</title>
    <meta name="description" content="A quiet daily habit tracker. Build streaks, one day at a time." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme and accent before first paint, so there's no
         flash of the wrong one. Both fall back to a default via CSS: no
         data-theme means follow the system, and the stylesheet carries the
         purple scheme for a first visit that has chosen nothing. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("daily.theme");
          if (t === "dark" || t === "light") root.setAttribute("data-theme", t);
        } catch (e) {}
        try {
          var s = localStorage.getItem("daily.color-scheme");
          root.setAttribute("data-scheme", s || "purple");
        } catch (e) {
          root.setAttribute("data-scheme", "purple");
        }
      })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)" />

    <!-- iOS home screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
